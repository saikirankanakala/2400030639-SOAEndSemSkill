spring.application.name=tourist-update-api
server.port=8080

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:touristdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT settings (secret must be at least 32 characters)
app.jwt.secret=change-this-secret-key-to-a-long-random-string-123456
app.jwt.expiration-ms=3600000

# Demo login credentials
app.auth.username=admin
app.auth.password=admin123
